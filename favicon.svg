<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="melonGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff3b3b" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#ff3b3b" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="melonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff5454"/>
      <stop offset="100%" stop-color="#b80000"/>
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff3b3b"/>
      <stop offset="100%" stop-color="rgba(255, 59, 59, 0.2)"/>
    </linearGradient>
  </defs>

  <!-- Ambient Glow -->
  <circle cx="256" cy="256" r="240" fill="url(#melonGlow)"/>

  <!-- Squircle Base (melon.studio inky obsidian) -->
  <rect x="48" y="48" width="416" height="416" rx="100" fill="#0f0202" stroke="url(#borderGrad)" stroke-width="12"/>

  <!-- Geometric Watermelon / Slice Segment (Subtle Brand Mark) -->
  <path d="M 120 180 A 150 150 0 0 0 392 180 Z" fill="none" stroke="#2a0808" stroke-width="16" stroke-dasharray="8 6"/>

  <!-- Monogram 'AS' Typography -->
  <text x="256" y="300" 
        font-family="-apple-system, BlinkMacSystemFont, 'Space Grotesk', 'Plus Jakarta Sans', sans-serif" 
        font-size="190" 
        font-weight="900" 
        letter-spacing="-10" 
        fill="#f6efed" 
        text-anchor="middle" 
        alignment-baseline="middle">AS</text>

  <!-- Melon Red Status Dot (The trademark pulse dot) -->
  <circle cx="370" cy="180" r="28" fill="url(#melonGrad)"/>
  <circle cx="370" cy="180" r="14" fill="#ffffff" opacity="0.85"/>
</svg>
